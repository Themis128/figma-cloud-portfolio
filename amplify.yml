version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - pnpm install --frozen-lockfile
        # Install Chrome for Puppeteer (PDF generation)
        - npx puppeteer browsers install chrome
    build:
      commands:
        - echo "Building application..."
        - node scripts/build-resume.js || true
        - pnpm exec vite build
        - pnpm exec vite build --config vite.config.server.ts
  artifacts:
    baseDirectory: dist/spa
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - /root/.cache/puppeteer/**/*

# Custom headers to fix MIME type issues
customHeaders:
  - pattern: '**/*.js'
    headers:
      - key: 'Content-Type'
        value: 'application/javascript'
  - pattern: '**/*.mjs'
    headers:
      - key: 'Content-Type'
        value: 'application/javascript'
  - pattern: '**/sw.js'
    headers:
      - key: 'Content-Type'
        value: 'application/javascript'
      - key: 'Service-Worker-Allowed'
        value: '/'
