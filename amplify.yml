version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - pnpm install
    build:
      commands:
        - echo "Building client application..."
        - pnpm run build:resume
        - pnpm run build:client
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**

# Custom headers to fix MIME type issues
customHeaders:
  - pattern: '**/*.js'
    headers:
      - key: 'Content-Type'
        value: 'application/javascript'
  - pattern: '**/*.mjs'
    headers:
      - key: 'Content-Type'
        value: 'application/javascript'
  - pattern: '**/sw.js'
    headers:
      - key: 'Content-Type'
        value: 'application/javascript'
      - key: 'Service-Worker-Allowed'
        value: '/'

backend:
  phases:
    build:
      commands:
        - echo "Building backend..."
        - pnpm run build:server
        - amplifyPush --simple