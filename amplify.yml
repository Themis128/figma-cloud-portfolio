version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - echo "Building application for Amplify deployment"
        - npm run build:client
        # Skip resume and server builds in CI/CD to prevent memory issues
  artifacts:
    baseDirectory: dist/spa
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  environment:
    NODE_OPTIONS: '--max-old-space-size=2048'
buildComputeType: LARGE_16GB

# Custom headers to fix MIME type issues
customHeaders:
  - pattern: '**/*.js'
    headers:
      - key: 'Content-Type'
        value: 'application/javascript'
  - pattern: '**/*.mjs'
    headers:
      - key: 'Content-Type'
        value: 'application/javascript'
  - pattern: '**/sw.js'
    headers:
      - key: 'Content-Type'
        value: 'application/javascript'
      - key: 'Service-Worker-Allowed'
        value: '/'
  - pattern: '**/api/**'
    headers:
      - key: 'Access-Control-Allow-Origin'
        value: '*'
      - key: 'Access-Control-Allow-Headers'
        value: 'Content-Type,Authorization'
      - key: 'Access-Control-Allow-Methods'
        value: 'GET,POST,PUT,DELETE,OPTIONS'
