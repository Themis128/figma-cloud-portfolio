version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - pnpm install
    build:
      commands:
        - echo "Building client application..."
        - pnpm run build:resume
        - pnpm run build:client
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**

backend:
  phases:
    build:
      commands:
        - echo "Building backend..."
        - pnpm run build:server
        - amplifyPush --simple
