version: 1
backend:
  phases:
    build:
      commands:
        - npm install -g pnpm
        - pnpm install --frozen-lockfile
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - echo "Frontend deployed via GitHub Actions to S3 + CloudFront. Skipping."
  artifacts:
    baseDirectory: /
    files:
      - /dev/null

# Custom headers for security and caching (CloudFront level)
customHeaders:
  # JavaScript files
  - pattern: "**/*.js"
    headers:
      - key: "Content-Type"
        value: "application/javascript"
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
      - key: "X-Content-Type-Options"
        value: "nosniff"

  # ES Modules
  - pattern: "**/*.mjs"
    headers:
      - key: "Content-Type"
        value: "application/javascript"
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
      - key: "X-Content-Type-Options"
        value: "nosniff"

  # CSS files
  - pattern: "**/*.css"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
      - key: "X-Content-Type-Options"
        value: "nosniff"

  # Images
  - pattern: "**/*.{png,jpg,jpeg,gif,webp,avif,svg,ico}"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=2592000, immutable"
      - key: "X-Content-Type-Options"
        value: "nosniff"

  # Fonts
  - pattern: "**/*.{woff,woff2,ttf,eot}"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
      - key: "Access-Control-Allow-Origin"
        value: "*"
      - key: "X-Content-Type-Options"
        value: "nosniff"

  # HTML files — security + caching headers
  - pattern: "**/*.html"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, must-revalidate"
      - key: "X-DNS-Prefetch-Control"
        value: "on"
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "Referrer-Policy"
        value: "origin-when-cross-origin"
      - key: "X-Frame-Options"
        value: "SAMEORIGIN"
      - key: "X-XSS-Protection"
        value: "1; mode=block"
      - key: "Content-Security-Policy"
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://www.google.com https://calendly.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"

  # JSON and manifest files
  - pattern: "**/*.{json,webmanifest}"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=86400, must-revalidate"
      - key: "X-Content-Type-Options"
        value: "nosniff"
