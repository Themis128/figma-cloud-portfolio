version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - echo "Building application for Amplify deployment"
        - npm run build:client
        # Skip resume and server builds in CI/CD to prevent memory issues
  artifacts:
    baseDirectory: dist/spa
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  environment:
    NODE_OPTIONS: '--max-old-space-size=2048'
buildComputeType: LARGE_16GB

# Lambda function configurations
functions:
  ping:
    runtime: nodejs18.x
    memory: 256
    timeout: 10
    build:
      commands:
        - cd amplify/functions && npm install
        - npx tsc ping.ts --target es2020 --module commonjs --outDir ping/
    handler: ping/index.handler

  demo:
    runtime: nodejs18.x
    memory: 512
    timeout: 30
    build:
      commands:
        - cd amplify/functions && npm install
        - npx tsc demo.ts --target es2020 --module commonjs --outDir demo/
    handler: demo/index.handler

  contact:
    runtime: nodejs18.x
    memory: 512
    timeout: 30
    build:
      commands:
        - cd amplify/functions && npm install
        - npx tsc contact.ts --target es2020 --module commonjs --outDir contact/
    handler: contact/index.handler

  resume:
    runtime: nodejs18.x
    memory: 2048
    timeout: 300
    build:
      commands:
        - cd amplify/functions && npm install
        - npx tsc resume.ts --target es2020 --module commonjs --outDir resume/
    handler: resume/index.handler
    environment:
      NODE_OPTIONS: '--max-old-space-size=2048'

  push-notifications:
    runtime: nodejs18.x
    memory: 512
    timeout: 30
    build:
      commands:
        - cd amplify/functions && npm install
        - npx tsc push-notifications.ts --target es2020 --module commonjs --outDir push-notifications/
    handler: push-notifications/index.handler

# Custom headers to fix MIME type issues
customHeaders:
  - pattern: '**/*.js'
    headers:
      - key: 'Content-Type'
        value: 'application/javascript'
  - pattern: '**/*.mjs'
    headers:
      - key: 'Content-Type'
        value: 'application/javascript'
  - pattern: '**/sw.js'
    headers:
      - key: 'Content-Type'
        value: 'application/javascript'
      - key: 'Service-Worker-Allowed'
        value: '/'
  - pattern: '**/api/**'
    headers:
      - key: 'Access-Control-Allow-Origin'
        value: '*'
      - key: 'Access-Control-Allow-Headers'
        value: 'Content-Type,Authorization'
      - key: 'Access-Control-Allow-Methods'
        value: 'GET,POST,PUT,DELETE,OPTIONS'
