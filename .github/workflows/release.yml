name: Release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
      AMPLIFY_BRANCH: ${{ secrets.AMPLIFY_BRANCH }}
      DEPLOY_TO_GHPAGES: ${{ secrets.DEPLOY_TO_GHPAGES }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:ci

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: |
            dist
            dist/spa

      - name: Optional - Publish Docker image
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != '' }}
        run: |
          echo "Publishing Docker image (placeholder). Configure registry steps and secrets."

      - name: Configure AWS credentials (optional)
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AMPLIFY_APP_ID != '' && env.AMPLIFY_BRANCH != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Start Amplify Console release
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AMPLIFY_APP_ID != '' && env.AMPLIFY_BRANCH != '' }}
        run: |
          aws amplify start-job --app-id ${{ secrets.AMPLIFY_APP_ID }} --branch-name ${{ secrets.AMPLIFY_BRANCH }} --job-type RELEASE

      - name: Configure GitHub Pages (optional)
        if: ${{ env.DEPLOY_TO_GHPAGES == 'true' }}
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        if: ${{ env.DEPLOY_TO_GHPAGES == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/spa

      - name: Deploy to GitHub Pages
        if: ${{ env.DEPLOY_TO_GHPAGES == 'true' }}
        uses: actions/deploy-pages@v4
