name: Codacy Security Scan

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  schedule:
    - cron: '15 14 * * 6'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@d840f886c4bd4edc059706d09c6a1586111c540b
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647
          tool: semgrep

      - name: Ensure valid SARIF file
        if: always()
        run: |
          VALID_SARIF='{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0","runs":[{"tool":{"driver":{"name":"Codacy","version":"0.0.0","rules":[]}},"results":[]}]}'
          if [ ! -s results.sarif ] || ! python3 -c "import json; json.load(open('results.sarif'))" 2>/dev/null; then
            rm -f results.sarif
            echo "$VALID_SARIF" > results.sarif
          fi

      - name: Upload SARIF results file
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
