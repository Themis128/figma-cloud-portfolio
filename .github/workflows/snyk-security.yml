name: Snyk Security Scan

on:
  pull_request:
    branches: [production, main]
  push:
    branches: [production]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  SNYK_CLI_VERSION: v1.1296.1

jobs:
  snyk-dependencies:
    name: Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Snyk CLI
        run: npm install -g snyk@${{ env.SNYK_CLI_VERSION }}

      - name: Run Snyk dependency scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          echo "## Snyk Dependency Scan" >> "$GITHUB_STEP_SUMMARY"
          if snyk test --org=${{ secrets.SNYK_ORG }} --severity-threshold=high --all-projects --project-name=portfolio-nextjs 2>&1 | tee /tmp/snyk-deps.txt; then
            echo "✅ No high/critical vulnerabilities found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Vulnerabilities detected — review output above" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -30 /tmp/snyk-deps.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Monitor project on Snyk dashboard
        if: github.ref == 'refs/heads/production'
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --org=${{ secrets.SNYK_ORG }} --all-projects --project-name=portfolio-nextjs

  snyk-code-and-iac:
    name: Code (SAST) + IaC Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Snyk CLI
        run: npm install -g snyk@${{ env.SNYK_CLI_VERSION }}

      - name: Run Snyk Code scan (SAST)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          echo "## Snyk Code Scan (SAST)" >> "$GITHUB_STEP_SUMMARY"
          if snyk code test --org=${{ secrets.SNYK_ORG }} --exclude=playwright-tests,scripts/test-*,cline-hooks 2>&1 | tee /tmp/snyk-code.txt; then
            echo "✅ No code security issues found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Code issues detected — review output above" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -30 /tmp/snyk-code.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Snyk IaC scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          echo "## Snyk IaC Scan" >> "$GITHUB_STEP_SUMMARY"
          if snyk iac test --org=${{ secrets.SNYK_ORG }} 2>&1 | tee /tmp/snyk-iac.txt; then
            echo "✅ No IaC misconfigurations found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ IaC issues detected — review output above" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -30 /tmp/snyk-iac.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
