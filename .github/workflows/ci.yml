name: CI

on:
  push:
    branches: [main, develop, production]
  pull_request:
    branches: [main, develop, production]

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fix formatting and auto-fix lint
        run: |
          npm run format:fix || true
          npm run lint:fix || true
          npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check code formatting
        run: npm run format:check

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage

      - name: Upload coverage to Codacy
        if: secrets.CODACY_PROJECT_TOKEN
        run: |
          echo "Codacy token present — uploading coverage"
          bash <(curl -Ls https://coverage.codacy.com/get.sh)
        env:
          CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

      - name: Skip Codacy upload when token missing
        if: '!secrets.CODACY_PROJECT_TOKEN'
        run: |
          echo "Codacy project token not configured, skipping coverage upload"

  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: [test, e2e]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Puppeteer (PDF generation)
        run: |
          # Install Chrome browser for Puppeteer
          npx puppeteer browsers install chrome
          # Verify installation
          echo "Chrome installed at:"
          find ~/.cache/puppeteer -name "chrome" -type f 2>/dev/null || echo "Chrome binary not found in default cache"

      - name: Build application (cross-platform)
        run: |
          node scripts/build-resume.js || true
          npm run build:client
          npm run build:server

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            amplify/
          retention-days: 30

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run comprehensive code quality checks
        run: |
          echo "🔍 Running comprehensive code quality analysis..."
          npm run lint
          npm run typecheck
          npm run test:unit -- --run

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true