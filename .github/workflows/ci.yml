name: CI

on:
  push:
    branches: [ main, develop, production ]
  pull_request:
    branches: [ main, develop, production ]

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run linter
      run: pnpm lint

    - name: Type check
      run: pnpm typecheck

    - name: Run unit tests
      run: pnpm test:unit

    # E2E tests are skipped in CI for now as they require a running dev server
    # They can be run locally with: pnpm dev:all && pnpm test:e2e
    # TODO: Enable E2E tests in CI once proper server setup is configured
    # - name: Install Playwright browsers
    #   run: pnpm exec playwright install --with-deps chromium
    # 
    # - name: Run E2E tests
    #   run: pnpm test:e2e --project=chromium
    #   env:
    #     CI: true

    # Test results upload disabled while E2E tests are skipped
    # - name: Upload test results
    #   uses: actions/upload-artifact@v4
    #   if: always()
    #   with:
    #     name: test-results-${{ matrix.node-version }}
    #     path: |
    #       test-results/
    #       playwright-report/
    #     retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build application
      run: pnpm build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          dist/
          amplify/
        retention-days: 30

  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    # Note: Uncomment below to upload results to GitHub Security tab
    # Requires code scanning to be enabled in repository settings
    # - name: Upload Trivy scan results to GitHub Security tab
    #   uses: github/codeql-action/upload-sarif@v4
    #   if: always()
    #   with:
    #     sarif_file: 'trivy-results.sarif'
    
    - name: Display Trivy scan results
      if: always()
      run: cat trivy-results.sarif | jq '.runs[0].results | length' || echo "No results found"