name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, production]
  pull_request:
    branches: [main, develop, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4.0.1
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm run lint

      - name: Run type checking
        run: pnpm run typecheck

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Check coverage threshold
        run: |
          # Check if coverage directory exists
          if [ ! -d "coverage" ]; then
            echo "❌ Coverage directory not found"
            exit 1
          fi

          # Check if coverage file exists
          if [ ! -f "coverage/coverage-summary.json" ]; then
            echo "❌ Coverage file not found: coverage/coverage-summary.json"
            exit 1
          fi

          # Extract coverage percentage using Node.js instead of jq
          COVERAGE=$(node -e "
            try {
              const coverage = require('./coverage/coverage-summary.json');
              const total = coverage.total || {};
              const lines = total.lines || {};
              console.log(lines.pct || 0);
            } catch (e) {
              console.log(0);
            }
          ")

          echo "Current coverage: ${COVERAGE}%"

          # Check if coverage meets minimum thresholds (using awk for float comparison)
          THRESHOLD=20  # Lower threshold for now, can be increased later
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l 2>/dev/null || echo "1") )); then
            echo "❌ Coverage ${COVERAGE}% is below required ${THRESHOLD}% threshold"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets ${THRESHOLD}% threshold"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3.1.5
        with:
          file: ./coverage/lcov.info
          flags: unittests # cspell: disable-line
          name: codecov-umbrella
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.1
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Start Express backend server
        run: |
          npx tsx server/node-build.ts > backend.log 2>&1 &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"
          
          # Wait for backend to be ready (max 30 seconds)
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/ping > /dev/null 2>&1; then
              echo "✅ Backend server is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Backend server failed to start"
              cat backend.log
              exit 1
            fi
            echo "⏳ Waiting for backend... ($i/30)"
            sleep 1
          done

      - name: Start Vite dev server
        run: |
          # Run vite directly without secrets wrapper (CI has env vars set)
          pnpm exec vite --port 3001 --host 0.0.0.0 > frontend.log 2>&1 &
          FRONTEND_PID=$!
          echo "Frontend PID: $FRONTEND_PID"
          
          # Wait for frontend to be ready (max 30 seconds)
          for i in {1..30}; do
            if curl -s http://localhost:3001 > /dev/null 2>&1; then
              echo "✅ Frontend server is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Frontend server failed to start"
              cat frontend.log
              exit 1
            fi
            echo "⏳ Waiting for frontend... ($i/30)"
            sleep 1
          done

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
        timeout-minutes: 10

      - name: Upload test results
        uses: actions/upload-artifact@v4.3.1
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: [test, e2e]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.1
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer (PDF generation)
        run: |
          # Install Chrome browser for Puppeteer with proper error handling
          echo "Installing Chrome for Puppeteer..."
          npx puppeteer browsers install chrome || {
            echo "Failed to install Chrome via Puppeteer, trying alternative method..."
            # Fallback: install via apt-get with modern keyring
            sudo apt-get update
            sudo apt-get install -y wget gnupg
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          }

          # Verify installation
          echo "Verifying Chrome installation..."
          if command -v google-chrome-stable >/dev/null 2>&1; then
            echo "✅ Chrome installed successfully"
            google-chrome-stable --version
          elif [ -f "$HOME/.cache/puppeteer/chrome/linux-*/chrome-linux64/chrome" ]; then
            echo "✅ Chrome installed via Puppeteer"
            $HOME/.cache/puppeteer/chrome/linux-*/chrome-linux64/chrome --version
          else
            echo "❌ Chrome installation failed"
            exit 1
          fi

      - name: Build application (cross-platform)
        run: |
          pnpm run build:resume
          pnpm run build:client
          pnpm run build:server

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.3.1
        with:
          name: build-artifacts
          path: |
            dist/
            amplify/
          retention-days: 30

