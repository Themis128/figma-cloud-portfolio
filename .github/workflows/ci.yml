name: CI

on:
  push:
    branches: [main, develop, production]
  pull_request:
    branches: [main, develop, production]

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Check code formatting
        run: pnpm format:check || echo "Formatting issues found - run 'pnpm format' to fix"

      - name: Run unit tests with coverage
        run: pnpm test:unit --coverage

      - name: Upload coverage to Codacy
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh)
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

    # E2E tests are skipped in CI for now as they require a running dev server
    # They can be run locally with: pnpm dev:all && pnpm test:e2e
    # TODO: Enable E2E tests in CI once proper server setup is configured
    # - name: Install Playwright browsers
    #   run: pnpm exec playwright install --with-deps chromium
    #
    # - name: Run E2E tests
    #   run: pnpm test:e2e --project=chromium
    #   env:
    #     CI: true

    # Test results upload disabled while E2E tests are skipped
    # - name: Upload test results
    #   uses: actions/upload-artifact@v4
    #   if: always()
    #   with:
    #     name: test-results-${{ matrix.node-version }}
    #     path: |
    #       test-results/
    #       playwright-report/
    #     retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer (PDF generation)
        run: |
          # Install Chrome browser for Puppeteer
          pnpm exec puppeteer browsers install chrome
          # Verify installation
          echo "Chrome installed at:"
          find ~/.cache/puppeteer -name "chrome" -type f 2>/dev/null || echo "Chrome binary not found in default cache"
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer

      - name: Build application (cross-platform)
        run: |
          node scripts/build-resume.js || true
          pnpm exec vite build
          pnpm exec vite build --config vite.config.server.ts
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            amplify/
          retention-days: 30

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run comprehensive code quality checks
        run: |
          echo "🔍 Running comprehensive code quality analysis..."
          pnpm lint
          pnpm typecheck
          pnpm test:unit --run

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
