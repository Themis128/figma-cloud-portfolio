name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, production]
  pull_request:
    branches: [main, develop, production]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm run lint

      - name: Run type checking
        run: pnpm run typecheck


  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Start Express backend server
        run: |
          npx tsx server/node-build.ts > backend.log 2>&1 &
          BACKEND_PID=$!
          echo "Backend PID: $BACKEND_PID"

          # Wait for backend to be ready (max 30 seconds)
          for i in {1..30}; do
            if curl -s http://localhost:3002/api/ping > /dev/null 2>&1; then
              echo "✅ Backend server is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Backend server failed to start"
              cat backend.log
              exit 1
            fi
            echo "⏳ Waiting for backend... ($i/30)"
            sleep 1
          done

      - name: Start Vite dev server
        run: |
          # Run vite directly without secrets wrapper (CI has env vars set)
          pnpm exec vite --port 8082 --host 0.0.0.0 > frontend.log 2>&1 &
          FRONTEND_PID=$!
          echo "Frontend PID: $FRONTEND_PID"

          # Wait for frontend to be ready (max 30 seconds)
          for i in {1..30}; do
            if curl -s http://localhost:8082 > /dev/null 2>&1; then
              echo "✅ Frontend server is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Frontend server failed to start"
              cat frontend.log
              exit 1
            fi
            echo "⏳ Waiting for frontend... ($i/30)"
            sleep 1
          done

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
        timeout-minutes: 20

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    needs: [test, e2e]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer (PDF generation)
        run: |
          # Install Chrome browser for Puppeteer with proper error handling
          echo "Installing Chrome for Puppeteer..."
          npx puppeteer browsers install chrome || {
            echo "Failed to install Chrome via Puppeteer, trying alternative method..."
            # Fallback: install via apt-get with modern keyring
            sudo apt-get update
            sudo apt-get install -y wget gnupg
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          }

          # Verify installation
          echo "Verifying Chrome installation..."
          if command -v google-chrome-stable >/dev/null 2>&1; then
            echo "✅ Chrome installed successfully"
            google-chrome-stable --version
          elif [ -f "$HOME/.cache/puppeteer/chrome/linux-*/chrome-linux64/chrome" ]; then
            echo "✅ Chrome installed via Puppeteer"
            $HOME/.cache/puppeteer/chrome/linux-*/chrome-linux64/chrome --version
          else
            echo "❌ Chrome installation failed"
            exit 1
          fi

      - name: Build application (cross-platform)
        run: |
          pnpm run build:resume
          pnpm run build:client
          pnpm run build:server

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.run_id }}
          path: |
            dist/
            amplify/
          retention-days: 30

