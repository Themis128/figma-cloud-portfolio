name: Playwright Tests

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build application
        run: pnpm run build

      - name: Run Playwright tests
        run: npx playwright test --config=playwright.config.ci.ts --shard=${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-html-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 30

  merge-reports:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all test reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports

      - name: Merge test reports
        run: npx playwright merge-reports ./all-blob-reports

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-merged
          path: playwright-report
          retention-days: 30

      - name: Display test results summary
        run: |
          if [ -f playwright-report/summary.json ]; then
            echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
            jq -r '. | "✅ **\(.passed)** tests passed\n❌ **\(.failed)** tests failed\n⏱️ **\(.duration)**ms total duration"' playwright-report/summary.json >> $GITHUB_STEP_SUMMARY
          fi
