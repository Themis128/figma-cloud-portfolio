name: Playwright Tests

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright browsers cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.local-share/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build application for CI
        run: pnpm run build:no-secrets
        env:
          CI: true
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -f dist/server/node-build.mjs ]; then
            echo "❌ Server build file not found!"
            exit 1
          fi
          echo "✅ Server build verified"
          ls -lh dist/server/

      - name: Run Playwright tests
        run: npx playwright test --config=playwright.config.ci.ts --shard=${{ matrix.shard }}
        env:
          SHARD: ${{ matrix.shard }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-html-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ strategy.job-index }}
          path: test-results/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ strategy.job-index }}
          path: blob-report/
          retention-days: 30

  merge-reports:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all test reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*

      - name: List downloaded artifacts
        run: |
          echo "Contents of all-blob-reports directory:"
          ls -laR all-blob-reports/

      - name: Merge test reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-merged
          path: playwright-report
          retention-days: 30

      - name: Display test results summary
        run: |
          if [ -f playwright-report/summary.json ]; then
            echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
            jq -r '. | "✅ **\(.passed)** tests passed\n❌ **\(.failed)** tests failed\n⏱️ **\(.duration)**ms total duration"' playwright-report/summary.json >> $GITHUB_STEP_SUMMARY
          fi
