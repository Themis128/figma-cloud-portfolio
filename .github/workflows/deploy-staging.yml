name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy-amplify-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Amplify (Staging)
        uses: aws-actions/amplify-cli-wrapper@1.2.0
        with:
          args: publish --app-id ${{ secrets.AMPLIFY_STAGING_APP_ID }} --branch-name staging
        env:
          NODE_ENV: staging
          VITE_APP_ENV: staging

      - name: Comment deployment URL
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Staging deployment successful!\n\n**Environment:** Staging\n**Branch:** develop\n**Commit:** ${context.sha}\n\nCheck AWS Amplify console for deployment URL.`
            })

  health-check:
    runs-on: ubuntu-latest
    needs: deploy-amplify-staging
    if: always() && needs.deploy-amplify-staging.result == 'success'

    steps:
      - name: Health check
        run: |
          echo "Staging deployment completed successfully"
          echo "Health checks would be implemented here"
