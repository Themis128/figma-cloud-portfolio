name: Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable corepack and pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Backend (Cognito auth) is stable — deploy manually with `pnpm amplify:deploy`
      # when amplify/ files change. Do NOT run ampx pipeline-deploy here — it creates
      # duplicate stacks and overwrites amplify_outputs.json with wrong pool IDs.

      - name: Generate Amplify outputs
        run: npx ampx generate outputs --branch production --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}

      - name: Cache Velite output
        uses: actions/cache@v4
        with:
          path: .velite
          key: velite-${{ hashFiles('content/blog/**', 'velite.config.ts') }}

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.baltzakisthemis.com
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

      - name: Deploy to S3 and capture changed files
        id: s3sync
        run: |
          # Sync and capture changed paths for targeted invalidation
          SYNC_OUTPUT=$(aws s3 sync out/ s3://figma-portfolio-static --delete --region us-east-1 2>&1) || true
          echo "$SYNC_OUTPUT"
          # Extract uploaded/deleted paths — handle filenames with spaces safely
          CHANGED=$(echo "$SYNC_OUTPUT" | awk '
            /^upload:/ { sub(/^upload: out\//, "/"); sub(/ to s3:.*/, ""); print }
            /^delete:/ { sub(/^delete: s3:\/\/figma-portfolio-static\//, "/"); print }
          ' | head -50)
          CHANGED_COUNT=$(echo "$CHANGED" | grep -c . || true)
          if [ "$CHANGED_COUNT" -eq 0 ]; then
            echo "No files changed — skipping invalidation"
            echo "paths=none" >> "$GITHUB_OUTPUT"
          elif [ "$CHANGED_COUNT" -gt 49 ]; then
            echo "$CHANGED_COUNT files changed — using wildcard invalidation"
            echo "paths=/*" >> "$GITHUB_OUTPUT"
          else
            echo "$CHANGED_COUNT files changed — targeted invalidation"
            echo "paths<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CHANGED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Invalidate CloudFront
        if: steps.s3sync.outputs.paths != 'none'
        run: |
          if [ "${{ steps.s3sync.outputs.paths }}" = "/*" ]; then
            PATHS_ARRAY=("/*")
          else
            # Read paths into an array — handles spaces in filenames safely
            mapfile -t PATHS_ARRAY <<< "${{ steps.s3sync.outputs.paths }}"
          fi
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E134SCTR0QGQKJ \
            --paths "${PATHS_ARRAY[@]}" \
            --query 'Invalidation.Id' --output text)
          echo "CloudFront invalidation: ${INVALIDATION_ID} (${#PATHS_ARRAY[@]} paths)"
          aws cloudfront wait invalidation-completed \
            --distribution-id E134SCTR0QGQKJ \
            --id "${INVALIDATION_ID}"
          echo "Invalidation completed"

      - name: Lighthouse CI smoke test
        timeout-minutes: 5
        run: |
          npx -y @lhci/cli@0.14.x autorun \
            --collect.url=https://www.baltzakisthemis.com/ \
            --collect.url=https://www.baltzakisthemis.com/about/ \
            --collect.url=https://www.baltzakisthemis.com/blog/ \
            --collect.numberOfRuns=3 \
            --assert.assertions.categories:performance=warn \
            --assert.assertions.categories:accessibility=warn \
            --assert.assertions.categories:best-practices=warn \
            --assert.assertions.categories:seo=warn \
            || echo "Lighthouse completed with warnings (non-blocking)"
