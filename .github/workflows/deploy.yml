name: Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable corepack and pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Backend (Cognito auth) is stable — deploy manually with `pnpm amplify:deploy`
      # when amplify/ files change. Do NOT run ampx pipeline-deploy here — it creates
      # duplicate stacks and overwrites amplify_outputs.json with wrong pool IDs.

      - name: Generate Amplify outputs
        run: npx ampx generate outputs --branch production --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.baltzakisthemis.com
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Deploy to S3 and capture changed files
        id: s3sync
        run: |
          # Sync and capture changed paths for targeted invalidation
          CHANGED=$(aws s3 sync out/ s3://figma-portfolio-static --delete --region us-east-1 2>&1 | grep -oP '(?<=upload: out/).*|(?<=delete: s3://figma-portfolio-static/).*' | sed 's|^|/|' | head -50)
          if [ -z "$CHANGED" ]; then
            echo "paths=none" >> "$GITHUB_OUTPUT"
          elif [ "$(echo "$CHANGED" | wc -l)" -gt 49 ]; then
            echo "paths=/*" >> "$GITHUB_OUTPUT"
          else
            echo "paths<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CHANGED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Invalidate CloudFront
        if: steps.s3sync.outputs.paths != 'none'
        run: |
          if [ "${{ steps.s3sync.outputs.paths }}" = "/*" ]; then
            PATHS="/*"
          else
            PATHS=$(echo "${{ steps.s3sync.outputs.paths }}" | tr '\n' ' ')
          fi
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E134SCTR0QGQKJ \
            --paths $PATHS \
            --query 'Invalidation.Id' --output text)
          echo "CloudFront invalidation: ${INVALIDATION_ID} ($(echo $PATHS | wc -w) paths)"
          aws cloudfront wait invalidation-completed \
            --distribution-id E134SCTR0QGQKJ \
            --id "${INVALIDATION_ID}"
          echo "Invalidation completed"

      - name: Lighthouse CI smoke test
        run: |
          npx -y @lhci/cli@0.14.x autorun \
            --collect.url=https://www.baltzakisthemis.com/ \
            --collect.url=https://www.baltzakisthemis.com/about/ \
            --collect.url=https://www.baltzakisthemis.com/blog/ \
            --collect.numberOfRuns=1 \
            --assert.assertions.categories:performance=warn \
            --assert.assertions.categories:accessibility=warn \
            --assert.assertions.categories:best-practices=warn \
            --assert.assertions.categories:seo=warn \
            || echo "Lighthouse completed with warnings (non-blocking)"
