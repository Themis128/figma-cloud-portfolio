name: Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Snyk CLI
        run: npm install -g snyk@v1.1296.1

      - name: Snyk security gate (critical vulnerabilities block deploy)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          echo "## Snyk Pre-Deploy Security Gate" >> "$GITHUB_STEP_SUMMARY"
          if snyk test --org=${{ secrets.SNYK_ORG }} --severity-threshold=critical --all-projects 2>&1 | tee /tmp/snyk-gate.txt; then
            echo "✅ No critical vulnerabilities — deploy proceeding" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Critical vulnerabilities found — deploy blocked" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -20 /tmp/snyk-gate.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Generate Amplify outputs
        run: npx ampx generate outputs --branch production --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.baltzakisthemis.com
          NEXT_PUBLIC_API_BASE_URL: /api
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      - name: Deploy to S3
        run: aws s3 sync out/ s3://figma-portfolio-static --delete --region us-east-1

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id E134SCTR0QGQKJ \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "CloudFront invalidation: ${INVALIDATION_ID}"
          aws cloudfront wait invalidation-completed \
            --distribution-id E134SCTR0QGQKJ \
            --id "${INVALIDATION_ID}"
          echo "Invalidation completed"
