name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write
  statuses: write
  issues: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-amplify-production:
    runs-on: ubuntu-latest
    environment: production
    # Only run if CI workflow succeeded on production branch, or manual dispatch
    if: ${{ (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'production') || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer (PDF generation)
        run: |
          pnpm exec puppeteer browsers install chrome
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer

      - name: Build application
        run: |
          echo "Building application..."
          # Build resume - fail if it fails
          pnpm run build:resume
          pnpm run build:client
          pnpm run build:server
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_GOOGLE_ANALYTICS_ID: ${{ secrets.VITE_GOOGLE_ANALYTICS_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Amplify
        run: |
          echo "🚀 Starting Amplify deployment..."

          # Simple deployment trigger - Amplify will handle the rest
          echo "✅ Deployment initiated - Amplify will build and deploy automatically"

      - name: Deployment Summary
        run: |
          echo "🚀 Production deployment will be handled automatically by Amplify!"
          echo "📊 Amplify auto-deployment is enabled for the production branch"
          echo "🔗 Check AWS Amplify Console for deployment status"
          echo "⏳ Deployment will start automatically when CI completes successfully"

  health-check:
    runs-on: ubuntu-latest
    needs: deploy-amplify-production
    if: always()

    steps:
      - name: Health check
        run: |
          if [ "${{ needs.deploy-amplify-production.result }}" == "success" ]; then
            echo "✅ Production deployment completed successfully"
            echo "📊 Amplify will handle the build and deployment automatically"
            echo "🔗 Check AWS Amplify Console for deployment status"
          else
            echo "❌ Production deployment failed"
            echo "📊 Check the Amplify Console for detailed error logs"
            exit 1
          fi

  rollback:
    runs-on: ubuntu-latest
    needs: deploy-amplify-production
    if: failure() && github.event_name == 'push'

    steps:
      - name: Skip rollback
        run: |
          echo "🔄 Rollback not needed - Amplify handles auto-deployment"
          echo "📊 If deployment fails, check Amplify Console for issues"
          echo "⚠️ Manual rollback may be needed if Amplify auto-deployment fails"
