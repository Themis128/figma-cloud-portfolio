name: Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write
  statuses: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-amplify-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer (PDF generation)
        run: |
          pnpm exec puppeteer browsers install chrome
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer

      - name: Build application
        run: pnpm build
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify Required Secrets
        run: |
          set -euo pipefail
          echo "🔍 Verifying required secrets..."
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then echo "❌ AWS_ACCESS_KEY_ID is not set" && exit 1; fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then echo "❌ AWS_SECRET_ACCESS_KEY is not set" && exit 1; fi
          if [ -z "${{ secrets.AWS_REGION }}" ]; then echo "❌ AWS_REGION is not set" && exit 1; fi
          if [ -z "${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}" ]; then echo "❌ AMPLIFY_PRODUCTION_APP_ID is not set" && exit 1; fi
          echo "✅ All required secrets are present"
          echo "AWS Region: ${{ secrets.AWS_REGION }}"
          echo "Amplify App ID: ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}"

      - name: Test AWS Credentials
        run: |
          set -euo pipefail
          echo "🔐 Testing AWS credentials..."
          aws sts get-caller-identity || (echo "❌ AWS credentials are invalid" && exit 1)
          echo "✅ AWS credentials are valid"

      - name: Verify Amplify App Configuration
        run: |
          set -euo pipefail
          echo "🔍 Verifying Amplify app configuration..."
          echo "App ID: ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}"
          echo "Region: ${{ secrets.AWS_REGION }}"
          echo "Branch: production"

          # Check if app exists
          aws amplify get-app --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --region ${{ secrets.AWS_REGION }} || (echo "❌ Amplify app not found" && exit 1)

          # Check if production branch exists
          aws amplify get-branch --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --branch-name production --region ${{ secrets.AWS_REGION }} || (echo "❌ Production branch not found" && exit 1)

          echo "✅ Amplify app and branch verified"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Trigger Amplify Auto-Deployment
        run: |
          set -euo pipefail
          echo "🚀 Triggering automatic Amplify deployment..."
          echo "App ID: ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}"
          echo "Branch: production"
          echo "Repository: Connected to GitHub - deployment will happen automatically"

          # Since the app is connected to the repository with auto-build enabled,
          # Amplify will automatically start deployment when code is pushed to production branch
          # We just need to verify the branch configuration
          aws amplify get-branch --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --branch-name production --region ${{ secrets.AWS_REGION }} --query 'branch.{enableAutoBuild:enableAutoBuild, branchName:branchName}' --output table

          echo "✅ Automatic deployment triggered - Amplify will build and deploy from GitHub"

      - name: Monitor Amplify Auto-Deployment
        run: |
          set -euo pipefail
          echo "🔍 Monitoring automatic Amplify deployment..."

          # Wait for Amplify to start the automatic deployment (may take a few minutes)
          TIMEOUT=1200  # 20 minutes total timeout
          INTERVAL=30
          ELAPSED=0

          echo "Waiting for Amplify to detect the push and start deployment..."

          while [ $ELAPSED -lt $TIMEOUT ]; do
            # Get the latest job for the production branch
            LATEST_JOB=$(aws amplify list-jobs --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --branch-name production --region ${{ secrets.AWS_REGION }} --query 'jobSummaries[0].jobId' --output text)

            if [ "$LATEST_JOB" != "None" ] && [ -n "$LATEST_JOB" ]; then
              echo "Found deployment job: $LATEST_JOB"

              # Monitor this job
              while [ $ELAPSED -lt $TIMEOUT ]; do
                STATUS=$(aws amplify get-job --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --branch-name production --job-id $LATEST_JOB --region ${{ secrets.AWS_REGION }} --query 'job.summary.status' --output text)

                echo "Current status: $STATUS (elapsed: ${ELAPSED}s)"

                case $STATUS in
                  "SUCCEED")
                    echo "✅ Deployment completed successfully!"
                    exit 0
                    ;;
                  "FAILED"|"FAULT")
                    echo "❌ Deployment failed"
                    aws amplify get-job --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --branch-name production --job-id $LATEST_JOB --region ${{ secrets.AWS_REGION }} --query 'job.steps[].stepName,job.steps[].status,job.steps[].logUrl' --output table || true
                    exit 1
                    ;;
                  "PENDING"|"PROVISIONING"|"RUNNING")
                    echo "⏳ Deployment still in progress..."
                    ;;
                  *)
                    echo "⚠️  Unknown status: $STATUS"
                    ;;
                esac

                sleep $INTERVAL
                ELAPSED=$((ELAPSED + INTERVAL))
              done
            fi

            echo "Waiting for deployment to start... (${ELAPSED}s elapsed)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "⏰ Timed out waiting for deployment to start"
          exit 1
        env:
          NODE_ENV: production
          VITE_APP_ENV: production
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Create deployment notification
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚀 Production Deployment ${new Date().toISOString().split('T')[0]}`,
              body: `## Production Deployment Successful\n\n**Environment:** Production\n**Branch:** production\n**Commit:** ${context.sha}\n**Deployed by:** @${context.actor}\n\n### Deployment Details\n- ✅ Build completed\n- ✅ Tests passed\n- ✅ Security scan passed\n- ✅ Deployed to AWS Amplify\n\nCheck AWS Amplify console for deployment URL.`,
              labels: ['deployment', 'production']
            })

  health-check:
    runs-on: ubuntu-latest
    needs: deploy-amplify-production
    if: always() && needs.deploy-amplify-production.result == 'success'

    steps:
      - name: Health check
        run: |
          echo "Production deployment completed successfully"
          echo "Health checks would be implemented here"

  rollback:
    runs-on: ubuntu-latest
    needs: deploy-amplify-production
    if: failure() && github.event_name == 'push'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Rollback deployment
        run: |
          set -euo pipefail
          echo "🔄 Starting Amplify rollback..."
          echo "App ID: ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}"
          echo "Branch: production"

          # Get the last successful job ID for rollback
          LAST_SUCCESSFUL_JOB=$(aws amplify list-jobs --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --branch-name production --region ${{ secrets.AWS_REGION }} --query 'jobSummaries[?status==`SUCCEED`]|sort_by(@,&endTime)|[-1].jobId' --output text)

          if [ -z "$LAST_SUCCESSFUL_JOB" ] || [ "$LAST_SUCCESSFUL_JOB" = "None" ]; then
            echo "❌ No successful deployment found to rollback to"
            exit 1
          fi

          echo "Rolling back to job: $LAST_SUCCESSFUL_JOB"

          # Start rollback deployment
          aws amplify start-job --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --branch-name production --job-id $LAST_SUCCESSFUL_JOB --job-type RETRY --region ${{ secrets.AWS_REGION }} || (echo "❌ Rollback failed" && exit 1)

          echo "✅ Rollback initiated"
        env:
          NODE_ENV: production
          VITE_APP_ENV: production
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Create rollback notification
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Production Rollback ${new Date().toISOString().split('T')[0]}`,
              body: `## Production Deployment Failed - Rollback Initiated\n\n**Environment:** Production\n**Branch:** production\n**Commit:** ${context.sha}\n**Triggered by:** @${context.actor}\n\n### Action Required\n- 🔍 Check deployment logs\n- 🐛 Fix issues in codebase\n- 🚀 Redeploy after fixes\n\nCheck AWS Amplify console for details.`,
              labels: ['deployment', 'production', 'rollback', 'urgent']
            })
