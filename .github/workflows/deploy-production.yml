name: Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write
  statuses: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-amplify-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer (PDF generation)
        run: |
          pnpm exec puppeteer browsers install chrome
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer

      - name: Build application
        run: pnpm build
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify Required Secrets
        run: |
          set -euo pipefail
          echo "🔍 Verifying required secrets..."
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then echo "❌ AWS_ACCESS_KEY_ID is not set" && exit 1; fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then echo "❌ AWS_SECRET_ACCESS_KEY is not set" && exit 1; fi
          if [ -z "${{ secrets.AWS_REGION }}" ]; then echo "❌ AWS_REGION is not set" && exit 1; fi
          if [ -z "${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}" ]; then echo "❌ AMPLIFY_PRODUCTION_APP_ID is not set" && exit 1; fi
          echo "✅ All required secrets are present"
          echo "AWS Region: ${{ secrets.AWS_REGION }}"
          echo "Amplify App ID: ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}"

      - name: Test AWS Credentials
        run: |
          set -euo pipefail
          echo "🔐 Testing AWS credentials..."
          aws sts get-caller-identity || (echo "❌ AWS credentials are invalid" && exit 1)
          echo "✅ AWS credentials are valid"

      - name: Verify Amplify App Configuration
        run: |
          set -euo pipefail
          npm install -g @aws-amplify/cli
          echo "Verifying Amplify app configuration..."
          echo "App ID: ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}"
          echo "Region: ${{ secrets.AWS_REGION }}"
          amplify status --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --verbose || (echo "❌ Amplify status check failed" && exit 1)
          echo "✅ Amplify app configuration verified"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Deploy to Amplify (Production)
        run: |
          set -euo pipefail
          npm install -g @aws-amplify/cli
          echo "🚀 Starting Amplify deployment..."
          echo "App ID: ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}"
          echo "Branch: main"
          echo "Environment: production"
          amplify publish --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --branch-name main --yes --verbose || (echo "❌ Amplify deployment failed" && exit 1)
          echo "✅ Deployment completed successfully"
        env:
          NODE_ENV: production
          VITE_APP_ENV: production
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Create deployment notification
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚀 Production Deployment ${new Date().toISOString().split('T')[0]}`,
              body: `## Production Deployment Successful\n\n**Environment:** Production\n**Branch:** production\n**Commit:** ${context.sha}\n**Deployed by:** @${context.actor}\n\n### Deployment Details\n- ✅ Build completed\n- ✅ Tests passed\n- ✅ Security scan passed\n- ✅ Deployed to AWS Amplify\n\nCheck AWS Amplify console for deployment URL.`,
              labels: ['deployment', 'production']
            })

  health-check:
    runs-on: ubuntu-latest
    needs: deploy-amplify-production
    if: always() && needs.deploy-amplify-production.result == 'success'

    steps:
      - name: Health check
        run: |
          echo "Production deployment completed successfully"
          echo "Health checks would be implemented here"

  rollback:
    runs-on: ubuntu-latest
    needs: deploy-amplify-production
    if: failure() && github.event_name == 'push'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Rollback deployment
        run: |
          set -euo pipefail
          npm install -g @aws-amplify/cli
          echo "🔄 Starting Amplify rollback..."
          echo "App ID: ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}"
          echo "Branch: main"
          amplify publish --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --branch-name main --rollback --yes --verbose || (echo "❌ Amplify rollback failed" && exit 1)
          echo "✅ Rollback completed"
        env:
          NODE_ENV: production
          VITE_APP_ENV: production
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Create rollback notification
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Production Rollback ${new Date().toISOString().split('T')[0]}`,
              body: `## Production Deployment Failed - Rollback Initiated\n\n**Environment:** Production\n**Branch:** production\n**Commit:** ${context.sha}\n**Triggered by:** @${context.actor}\n\n### Action Required\n- 🔍 Check deployment logs\n- 🐛 Fix issues in codebase\n- 🚀 Redeploy after fixes\n\nCheck AWS Amplify console for details.`,
              labels: ['deployment', 'production', 'rollback', 'urgent']
            })
