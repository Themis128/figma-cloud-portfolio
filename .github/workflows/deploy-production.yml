name: Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write
  statuses: write
  issues: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy-amplify-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for Puppeteer (PDF generation)
        run: |
          pnpm exec puppeteer browsers install chrome
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer

      - name: Build application
        run: |
          node scripts/build-resume.js || true
          pnpm exec vite build
          pnpm exec vite build --config vite.config.server.ts
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify Required Secrets
        run: |
          set -euo pipefail
          echo "🔍 Verifying required secrets..."
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then echo "❌ AWS_ACCESS_KEY_ID is not set" && exit 1; fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then echo "❌ AWS_SECRET_ACCESS_KEY is not set" && exit 1; fi
          if [ -z "${{ secrets.AWS_REGION }}" ]; then echo "❌ AWS_REGION is not set" && exit 1; fi
          if [ -z "${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}" ]; then echo "❌ AMPLIFY_PRODUCTION_APP_ID is not set" && exit 1; fi
          echo "✅ All required secrets are present"
          echo "AWS Region: ${{ secrets.AWS_REGION }}"
          echo "Amplify App ID: ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}"

      - name: Test AWS Credentials
        run: |
          set -euo pipefail
          echo "🔐 Testing AWS credentials..."
          aws sts get-caller-identity || (echo "❌ AWS credentials are invalid" && exit 1)
          echo "✅ AWS credentials are valid"

      - name: Verify Amplify App Configuration
        run: |
          set -euo pipefail
          echo "🔍 Verifying Amplify app configuration..."
          echo "App ID: ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}"
          echo "Region: ${{ secrets.AWS_REGION }}"
          echo "Branch: production"

          # Check if app exists
          aws amplify get-app --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --region ${{ secrets.AWS_REGION }} || (echo "❌ Amplify app not found" && exit 1)

          # Check if production branch exists
          aws amplify get-branch --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --branch-name production --region ${{ secrets.AWS_REGION }} || (echo "❌ Production branch not found" && exit 1)

          echo "✅ Amplify app and branch verified"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Confirm Amplify Auto-Deployment Setup
        run: |
          set -euo pipefail
          echo "🚀 Confirming Amplify auto-deployment setup..."
          echo "App ID: ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}"
          echo "Branch: production"

          # Verify the branch is configured for auto-build
          BRANCH_INFO=$(aws amplify get-branch --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --branch-name production --region ${{ secrets.AWS_REGION }} --query 'branch.{enableAutoBuild:enableAutoBuild, branchName:branchName}' --output json)

          ENABLE_AUTO_BUILD=$(echo $BRANCH_INFO | jq -r '.enableAutoBuild')
          BRANCH_NAME=$(echo $BRANCH_INFO | jq -r '.branchName')

          echo "Branch: $BRANCH_NAME"
          echo "Auto-build enabled: $ENABLE_AUTO_BUILD"

          if [ "$ENABLE_AUTO_BUILD" = "true" ]; then
            echo "✅ Amplify auto-deployment is properly configured"
            echo "📊 Amplify will automatically build and deploy when code is pushed to production branch"
            echo "🔗 Check AWS Amplify Console: https://${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}.amplifyapp.com"
          else
            echo "⚠️ Auto-build is disabled - deployment may not trigger automatically"
            echo "📋 Check Amplify Console to enable auto-build for production branch"
          fi

        env:
          NODE_ENV: production
          VITE_APP_ENV: production
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Deploy to Amplify (Production)
        run: |
          set -euo pipefail
          echo "🚀 Starting Amplify deployment..."
          echo "App ID: ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}"
          echo "Branch: production"

          # Start the deployment
          aws amplify start-deployment --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --branch-name production --region ${{ secrets.AWS_REGION }} || (echo "❌ Deployment failed to start" && exit 1)

          echo "✅ Deployment initiated successfully"

          # Wait for deployment to complete (optional - can be removed if you prefer async deployment)
          echo "⏳ Waiting for deployment to complete..."
          MAX_WAIT=600  # 10 minutes
          WAIT_TIME=0

          while [ $WAIT_TIME -lt $MAX_WAIT ]; do
            # Get the latest job status
            JOB_STATUS=$(aws amplify list-jobs --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --branch-name production --region ${{ secrets.AWS_REGION }} --query 'jobSummaries[0].status' --output text)

            echo "Current deployment status: $JOB_STATUS"

            case $JOB_STATUS in
              "SUCCEED")
                echo "✅ Deployment completed successfully!"
                break
                ;;
              "FAILED"|"CANCELLED")
                echo "❌ Deployment failed with status: $JOB_STATUS"
                exit 1
                ;;
              "PENDING"|"RUNNING")
                echo "⏳ Deployment still in progress... ($WAIT_TIME/$MAX_WAIT seconds)"
                sleep 30
                WAIT_TIME=$((WAIT_TIME + 30))
                ;;
              *)
                echo "⚠️ Unknown deployment status: $JOB_STATUS"
                sleep 30
                WAIT_TIME=$((WAIT_TIME + 30))
                ;;
            esac
          done

          if [ $WAIT_TIME -ge $MAX_WAIT ]; then
            echo "⏰ Deployment timed out after $MAX_WAIT seconds"
            echo "📊 Check AWS Amplify Console for current status"
            exit 1
          fi
        env:
          NODE_ENV: production
          VITE_APP_ENV: production
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Deployment Summary
        run: |
          echo "🚀 Production deployment triggered successfully!"
          echo "📊 Check AWS Amplify Console for deployment status"
          echo "🔗 App URL: https://${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}.amplifyapp.com"

  health-check:
    runs-on: ubuntu-latest
    needs: deploy-amplify-production
    if: always() && needs.deploy-amplify-production.result == 'success'

    steps:
      - name: Health check
        run: |
          echo "Production deployment completed successfully"
          echo "Health checks would be implemented here"

  rollback:
    runs-on: ubuntu-latest
    needs: deploy-amplify-production
    if: failure() && github.event_name == 'push'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Rollback deployment
        run: |
          set -euo pipefail
          echo "🔄 Starting Amplify rollback..."
          echo "App ID: ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }}"
          echo "Branch: production"

          # Get the last successful job ID for rollback
          LAST_SUCCESSFUL_JOB=$(aws amplify list-jobs --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --branch-name production --region ${{ secrets.AWS_REGION }} --query 'jobSummaries[?status==`SUCCEED`]|sort_by(@,&endTime)|[-1].jobId' --output text)

          if [ -z "$LAST_SUCCESSFUL_JOB" ] || [ "$LAST_SUCCESSFUL_JOB" = "None" ]; then
            echo "❌ No successful deployment found to rollback to"
            exit 1
          fi

          echo "Rolling back to job: $LAST_SUCCESSFUL_JOB"

          # Start rollback deployment
          aws amplify start-job --app-id ${{ secrets.AMPLIFY_PRODUCTION_APP_ID }} --branch-name production --job-id $LAST_SUCCESSFUL_JOB --job-type RETRY --region ${{ secrets.AWS_REGION }} || (echo "❌ Rollback failed" && exit 1)

          echo "✅ Rollback initiated"
        env:
          NODE_ENV: production
          VITE_APP_ENV: production
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Rollback Summary
        if: always()
        run: |
          echo "🔄 Rollback process completed"
          echo "📊 Check AWS Amplify Console for rollback status"