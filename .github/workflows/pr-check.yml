name: PR Quality Check

on:
  pull_request:
    branches: [production, main]

permissions:
  contents: read

# Shared setup anchors — DRY across jobs
env:
  NODE_VERSION: '22'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable corepack and pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create mock amplify_outputs.json
        run: |
          cat > amplify_outputs.json << 'MOCK'
          {
            "version": "1.3",
            "auth": {
              "user_pool_id": "us-east-1_CImock",
              "aws_region": "us-east-1",
              "user_pool_client_id": "ci-mock-client-id",
              "identity_pool_id": "us-east-1:00000000-0000-0000-0000-000000000000",
              "mfa_methods": [],
              "standard_required_attributes": ["email"],
              "username_attributes": ["email"],
              "user_verification_types": ["email"],
              "mfa_configuration": "NONE",
              "password_policy": {
                "min_length": 8,
                "require_numbers": true,
                "require_lowercase": true,
                "require_uppercase": true,
                "require_symbols": true
              },
              "unauthenticated_identities_enabled": true
            }
          }
          MOCK

      - name: Generate Velite types
        run: npx velite build

      - name: TypeScript check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.baltzakisthemis.com
          NEXT_PUBLIC_API_BASE_URL: /api

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs in parallel with quality — no needs: dependency

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable corepack and pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create mock amplify_outputs.json
        run: |
          cat > amplify_outputs.json << 'MOCK'
          {
            "version": "1.3",
            "auth": {
              "user_pool_id": "us-east-1_CImock",
              "aws_region": "us-east-1",
              "user_pool_client_id": "ci-mock-client-id",
              "identity_pool_id": "us-east-1:00000000-0000-0000-0000-000000000000",
              "mfa_methods": [],
              "standard_required_attributes": ["email"],
              "username_attributes": ["email"],
              "user_verification_types": ["email"],
              "mfa_configuration": "NONE",
              "password_policy": {
                "min_length": 8,
                "require_numbers": true,
                "require_lowercase": true,
                "require_uppercase": true,
                "require_symbols": true
              },
              "unauthenticated_identities_enabled": true
            }
          }
          MOCK

      - name: Generate Velite types
        run: npx velite build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright (Chromium only)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start servers
        run: |
          # Start Express and Next.js in parallel
          PORT=3001 npx tsx server/index.ts &
          echo $! > /tmp/express.pid
          pnpm dev &
          echo $! > /tmp/nextjs.pid

          # Wait for both servers concurrently
          timeout 30 bash -c 'until curl -sf http://localhost:3001/api/ping > /dev/null 2>&1; do sleep 2; done' \
            || (echo "::error::Express backend failed to start"; exit 1) &
          WAIT_EXPRESS=$!

          timeout 120 bash -c 'until curl -s http://localhost:3000 > /dev/null 2>&1; do sleep 3; done' \
            || (echo "::error::Next.js dev server failed to start"; exit 1) &
          WAIT_NEXTJS=$!

          wait $WAIT_EXPRESS || exit 1
          wait $WAIT_NEXTJS || exit 1
          echo "Both servers ready"
        env:
          NODE_ENV: test

      - name: Run E2E smoke tests (Chromium only)
        run: npx playwright test --project=chromium --grep="@smoke" --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Cleanup servers
        if: always()
        run: |
          kill "$(cat /tmp/express.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/nextjs.pid 2>/dev/null)" 2>/dev/null || true
