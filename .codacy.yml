# Codacy Configuration
# This file configures Codacy analysis for your portfolio project

engines:
  # Enable JavaScript/TypeScript analysis
  eslint:
    enabled: true
  # Enable duplication detection
  duplication:
    enabled: true
  # Enable complexity analysis
  complexity:
    enabled: true
  # Enable security analysis
  bandit:
    enabled: false # Disable Python security (not needed for JS/TS)
  # Enable markdown linting
  markdownlint:
    enabled: true

# File patterns to exclude from analysis
exclude_paths:
  - 'node_modules/**/*'
  - 'dist/**/*'
  - '.next/**/*'
  - 'build/**/*'
  - 'coverage/**/*'
  - 'test-results/**/*'
  - 'playwright-report/**/*'
  - '*.min.js'
  - '*.min.css'
  - 'public/**/*'
  - '.github/**/*'
  - 'amplify/**/*'
  - 'scripts/**/*'
  - '*.config.js'
  - '*.config.ts'
  - '*.config.mjs'

# Coverage configuration
coverage:
  disabled: false
  # Add coverage reporters if you have test coverage
  # reporters:
  #   - lcov
  #   - cobertura
