# Codacy Configuration
engines:
  eslint:
    enabled: true
  duplication:
    enabled: true
  metrics:
    enabled: true

exclude_paths:
  - 'dist/**'
  - 'node_modules/**'
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - 'coverage/**'
  - 'playwright-report/**'
  - 'test-results/**'

coverage:
  disabled: false
